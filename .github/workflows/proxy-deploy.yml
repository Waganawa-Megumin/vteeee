name: Deploy Proxy (Cloudflare)

# Optional. Deploys the Cloudflare Worker proxy that holds the VT key.
# Prerequisites (one-time):
#   1) Create a KV namespace:  wrangler kv namespace create VTEEEE_KV
#      and paste its id into proxy/cloudflare/wrangler.toml
#   2) Add repo secrets: VT_API_KEY, ANTHROPIC_API_KEY (optional),
#      SHODAN_API_KEY (optional), MAXMIND_ACCOUNT_ID + MAXMIND_LICENSE_KEY
#      (optional), DOMAINTOOLS_API_USERNAME + DOMAINTOOLS_API_KEY
#      (optional), DNSLYTICS_API_KEY (optional), INTEL471_API_USER +
#      INTEL471_API_KEY (optional), CYFIRMA_API_KEY (optional),
#      THREATVISION_CLIENT_ID + THREATVISION_CLIENT_SECRET (optional),
#      SOCPRIME_API_KEY (optional), RECORDEDFUTURE_API_KEY (optional),
#      URLSCAN_API_KEY (optional),
#      ACCESS_TOKEN, ADMIN_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   3) Set ALLOWED_ORIGINS in wrangler.toml to your *.github.io origin + localhost
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proxy/cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Deploy worker
        run: pnpm exec wrangler deploy
      - name: Push secrets
        run: |
          printf '%s' "${{ secrets.VT_API_KEY }}"        | pnpm exec wrangler secret put VT_API_KEY
          printf '%s' "${{ secrets.ACCESS_TOKEN }}"      | pnpm exec wrangler secret put ACCESS_TOKEN
          printf '%s' "${{ secrets.ADMIN_TOKEN }}"       | pnpm exec wrangler secret put ADMIN_TOKEN
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | pnpm exec wrangler secret put ANTHROPIC_API_KEY
          fi
          if [ -n "${{ secrets.SHODAN_API_KEY }}" ]; then
            printf '%s' "${{ secrets.SHODAN_API_KEY }}" | pnpm exec wrangler secret put SHODAN_API_KEY
          fi
          if [ -n "${{ secrets.MAXMIND_ACCOUNT_ID }}" ] && [ -n "${{ secrets.MAXMIND_LICENSE_KEY }}" ]; then
            printf '%s' "${{ secrets.MAXMIND_ACCOUNT_ID }}" | pnpm exec wrangler secret put MAXMIND_ACCOUNT_ID
            printf '%s' "${{ secrets.MAXMIND_LICENSE_KEY }}" | pnpm exec wrangler secret put MAXMIND_LICENSE_KEY
          fi
          if [ -n "${{ secrets.DOMAINTOOLS_API_USERNAME }}" ] && [ -n "${{ secrets.DOMAINTOOLS_API_KEY }}" ]; then
            printf '%s' "${{ secrets.DOMAINTOOLS_API_USERNAME }}" | pnpm exec wrangler secret put DOMAINTOOLS_API_USERNAME
            printf '%s' "${{ secrets.DOMAINTOOLS_API_KEY }}" | pnpm exec wrangler secret put DOMAINTOOLS_API_KEY
          fi
          if [ -n "${{ secrets.DNSLYTICS_API_KEY }}" ]; then
            printf '%s' "${{ secrets.DNSLYTICS_API_KEY }}" | pnpm exec wrangler secret put DNSLYTICS_API_KEY
          fi
          if [ -n "${{ secrets.INTEL471_API_USER }}" ] && [ -n "${{ secrets.INTEL471_API_KEY }}" ]; then
            printf '%s' "${{ secrets.INTEL471_API_USER }}" | pnpm exec wrangler secret put INTEL471_API_USER
            printf '%s' "${{ secrets.INTEL471_API_KEY }}" | pnpm exec wrangler secret put INTEL471_API_KEY
          fi
          if [ -n "${{ secrets.CYFIRMA_API_KEY }}" ]; then
            printf '%s' "${{ secrets.CYFIRMA_API_KEY }}" | pnpm exec wrangler secret put CYFIRMA_API_KEY
          fi
          if [ -n "${{ secrets.THREATVISION_CLIENT_ID }}" ] && [ -n "${{ secrets.THREATVISION_CLIENT_SECRET }}" ]; then
            printf '%s' "${{ secrets.THREATVISION_CLIENT_ID }}" | pnpm exec wrangler secret put THREATVISION_CLIENT_ID
            printf '%s' "${{ secrets.THREATVISION_CLIENT_SECRET }}" | pnpm exec wrangler secret put THREATVISION_CLIENT_SECRET
          fi
          if [ -n "${{ secrets.SOCPRIME_API_KEY }}" ]; then
            printf '%s' "${{ secrets.SOCPRIME_API_KEY }}" | pnpm exec wrangler secret put SOCPRIME_API_KEY
          fi
          if [ -n "${{ secrets.RECORDEDFUTURE_API_KEY }}" ]; then
            printf '%s' "${{ secrets.RECORDEDFUTURE_API_KEY }}" | pnpm exec wrangler secret put RECORDEDFUTURE_API_KEY
          fi
          if [ -n "${{ secrets.URLSCAN_API_KEY }}" ]; then
            printf '%s' "${{ secrets.URLSCAN_API_KEY }}" | pnpm exec wrangler secret put URLSCAN_API_KEY
          fi
