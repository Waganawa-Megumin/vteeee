<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2a24" />
    <!-- Installable (Add to Home Screen) — also helps storage survive eviction on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="vteeee" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>vteeee — bulk IOC search</title>
    <meta
      name="description"
      content="Bulk IOC search for CTI analysts. Paste IPs, domains, URLs or hashes (even defanged) and enrich via VirusTotal / Google Threat Intelligence."
    />

    <!-- Link preview (Open Graph + Twitter). Absolute URLs — update if the Pages URL changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="vteeee" />
    <meta property="og:title" content="vteeee — bulk IOC search" />
    <meta
      property="og:description"
      content="Paste defanged IPs / domains / URLs / hashes and bulk-enrich via VirusTotal / Google Threat Intelligence."
    />
    <meta property="og:url" content="https://waganawa-megumin.github.io/vteeee/" />
    <meta property="og:image" content="https://waganawa-megumin.github.io/vteeee/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="vteeee — bulk IOC search" />
    <meta
      name="twitter:description"
      content="Paste defanged IPs / domains / URLs / hashes and bulk-enrich via VirusTotal / GTI."
    />
    <meta name="twitter:image" content="https://waganawa-megumin.github.io/vteeee/og-image.png" />

    <script>
      // Apply the saved theme before paint to avoid a flash.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('vteeee.theme') || 'chalk';
      } catch (e) {
        document.documentElement.dataset.theme = 'chalk';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
