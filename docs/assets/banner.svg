<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="vteeee — bulk IOC search">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243029"/>
      <stop offset="1" stop-color="#1a241e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>
  <rect x="18" y="18" width="1244" height="364" rx="18" fill="none" stroke="#44564a" stroke-dasharray="2 7" stroke-width="2" opacity="0.65"/>

  <!-- wordmark -->
  <text x="82" y="152" font-size="94" font-weight="800" fill="#74d3b1" letter-spacing="1">vteeee</text>
  <text x="86" y="198" font-size="25" fill="#e9e7d6" opacity="0.92">bulk IOC search · VirusTotal / Google Threat Intelligence</text>
  <rect x="86" y="216" width="544" height="3" rx="2" fill="#74d3b1" opacity="0.85"/>

  <!-- defang -> refang strip -->
  <text x="86" y="284" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#aebcae">1[.]1[.]1[.]1   hxxps://evil[.]com/login   44d88612…</text>
  <text x="86" y="320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#86d98f">→  1.1.1.1   https://evil.com/login   eicar   ✓ enriched</text>

  <!-- mark -->
  <g transform="translate(985,92)">
    <rect width="208" height="208" rx="44" fill="#1f2a24" stroke="#44564a" stroke-width="2"/>
    <path d="M54 70 L104 158 L154 70" fill="none" stroke="#74d3b1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="173" r="11" fill="#e9e7d6"/>
  </g>

  <!-- verdict chips -->
  <g font-size="17" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">
    <rect x="985" y="318" width="98" height="30" rx="15" fill="#ff6f86" fill-opacity="0.18"/>
    <text x="1000" y="338" fill="#ff6f86">malicious</text>
    <rect x="1093" y="318" width="100" height="30" rx="15" fill="#86d98f" fill-opacity="0.18"/>
    <text x="1108" y="338" fill="#86d98f">harmless</text>
  </g>
</svg>
