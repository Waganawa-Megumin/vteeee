name = "vteeee-proxy"
main = "src/worker.ts"
compatibility_date = "2024-11-01"

# Non-secret config. Set ALLOWED_ORIGINS to your *.github.io origin + localhost.
[vars]
ALLOWED_ORIGINS = "https://waganawa-megumin.github.io,http://localhost:5173"
VT_RPM = "4"
VT_MAX_RPM = "1000"
# Cost / abuse guards (best-effort, backed by KV):
MAX_BATCH = "1000"      # max indicators per /api/enrich request
VT_DAILY = "5000"       # max VT lookups per day (paid GTI)
PARSE_DAILY = "2000"    # max Claude smart-parse calls per day (paid)
# Pin the cheap model. Opus is refused in code regardless of this value.
CLAUDE_MODEL = "claude-haiku-4-5"
# Shared search history (KV) retention in days; 0 disables saving.
HISTORY_DAYS = "30"

# Shared store for users/settings (admin management).
# Create once:  wrangler kv namespace create VTEEEE_KV
# then paste the id below.
[[kv_namespaces]]
binding = "VTEEEE_KV"
id = "64fde3553d4b4272a3afa346945a0ce0"

# Optional: per-minute caps for the optional enrichers.
# SHODAN_RPM = "60"
# MAXMIND_RPM = "60"
# MAXMIND_EDITION = "insights"   # insights (default — richest) / city / country
# GeoLite2 (free): MAXMIND_BASE_URL = "https://geolite.info" (+ MAXMIND_EDITION = "city")
# DOMAINTOOLS_RPM = "30"
# DNSLYTICS_RPM = "60"
# INTEL471_RPM = "60"
# CYFIRMA_RPM = "30"
# THREATVISION_RPM = "30"   # IP/domain detail cost 1 AAP each; hashes (samples search) cost 0 AAP
# RECORDEDFUTURE_RPM = "30"
# Override only if your DNSLytics endpoint differs from the default:
# DNSLYTICS_BASE_URL = "https://api.dnslytics.net/v1"
# Override only if your DeCYFIR endpoint differs from the default:
# CYFIRMA_BASE_URL = "https://decyfir.cyfirma.com/core/api-ua"
# Override only if your ThreatVision endpoint differs from the default:
# THREATVISION_BASE_URL = "https://api.threatvision.org"
# Override only if your SOC Prime endpoint differs from the default:
# SOCPRIME_BASE_URL = "https://api.tdm.socprime.com"
# Override only if your Recorded Future endpoint differs from the default:
# RECORDEDFUTURE_BASE_URL = "https://api.recordedfuture.com"
# AbuseIPDB CHECK maxAgeInDays (1-365, how far back reports are considered). Default 90.
# ABUSEIPDB_MAX_AGE_DAYS = "90"
# ABUSEIPDB_RPM = "60"
# Override only if your AbuseIPDB endpoint differs from the default:
# ABUSEIPDB_BASE_URL = "https://api.abuseipdb.com/api/v2"
# urlscan.io on-demand "魚拓" default visibility: public / unlisted (default) / private
# URLSCAN_VISIBILITY = "unlisted"
# OPSEC: `public` is clamped to `unlisted` unless you explicitly allow it here. Leave OFF for
# covert investigation so scans never hit urlscan's public feed/search.
# URLSCAN_ALLOW_PUBLIC = "false"
# OPSEC: leave tags EMPTY — urlscan tags are searchable and would let anyone cluster your scans.
# URLSCAN_TAGS = ""
# Override only if your urlscan endpoint differs from the default:
# URLSCAN_BASE_URL = "https://urlscan.io"

# Secrets are NOT stored here. Set them with:
#   wrangler secret put VT_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY         # optional (Claude smart-parse)
#   wrangler secret put SHODAN_API_KEY            # optional (Shodan OSINT on IP rows)
#   wrangler secret put MAXMIND_ACCOUNT_ID        # optional (MaxMind GeoIP: account ID)
#   wrangler secret put MAXMIND_LICENSE_KEY       # optional (paired with the account ID)
#   wrangler secret put DOMAINTOOLS_API_USERNAME  # optional (Iris: domains + IP reverse)
#   wrangler secret put DOMAINTOOLS_API_KEY       # optional (paired with the username)
#   wrangler secret put DNSLYTICS_API_KEY         # optional (IP + domain intel)
#   wrangler secret put INTEL471_API_USER         # optional (Titan: API email)
#   wrangler secret put INTEL471_API_KEY          # optional (Titan: API key)
#   wrangler secret put CYFIRMA_API_KEY           # optional (DeCYFIR: risk dossier + attribution)
#   wrangler secret put THREATVISION_CLIENT_ID    # optional (TeamT5 ThreatVision: OAuth client id)
#   wrangler secret put THREATVISION_CLIENT_SECRET# optional (paired with the client id)
#   wrangler secret put SOCPRIME_API_KEY          # optional (SOC Prime: Uncoder IOC→SIEM query)
#   wrangler secret put RECORDEDFUTURE_API_KEY    # optional (Recorded Future: risk intel + pivots + rules)
#   wrangler secret put URLSCAN_API_KEY           # optional (urlscan.io: on-demand URL/domain 魚拓 scans)
#   wrangler secret put ABUSEIPDB_API_KEY         # optional (AbuseIPDB: IP abuse-confidence score + reports)
#   wrangler secret put ACCESS_TOKEN              # required on /api/*
#   wrangler secret put ADMIN_TOKEN               # required on /api/admin/*
